name: arogya_care_file_system
description: "ArogyaCareFileSystem - Prescription Vault + Medicine Finder"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  provider: ^6.1.2
  go_router: ^14.2.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0
  flutter_local_notifications: ^18.0.0
  hive_flutter: ^1.1.0
  geolocator: ^9.0.2
  url_launcher: ^6.3.0
  intl: ^0.20.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/